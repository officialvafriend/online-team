<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>탭탭 농구</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#1b1f2a;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  .wrap{height:100%;display:flex;align-items:center;justify-content:center}
  canvas{height:min(100vh, calc(100vw * 800 / 480));aspect-ratio:480/800;display:block;background:#f2f4f6}
  @media (min-width:700px){ canvas{border-radius:22px;height:min(96vh, 900px)} }
</style>
</head>
<body>
<div class="wrap"><canvas id="c" width="480" height="800"></canvas></div>
<script>
// 탭탭 농구 (10/28 사장님: tooj.net 탭탭 샷과 똑같이, 공은 농구공, 공에 VF 로고, 하루 5판)
// 규칙: 탭하면 공이 튀어 오름. 공은 골대 쪽으로 계속 흐르고 화면 끝을 나가면 반대편에서 다시 나옴. 골대를 위에서 통과하면 득점, 림 안 건드리면 스위시(2점), 연속 스위시는 콤보.
// 골 넣을 때마다 시간이 다시 채워지고, 시간이 다 되거나 공이 바닥으로 떨어지면 끝. 하루 5판(기기별, 새벽 5시 기준), ?free=1 이면 제한 없음(우리 시험용)
const W = 480, H = 800, FLOOR = 740; // 10/28 사장님 "바닥은 평평하게": 바닥에 떨어져도 끝이 아니라 튕김, 시간만 조심
const cv = document.getElementById("c"), ctx = cv.getContext("2d");
const IMG = {}; const load = (k, src) => new Promise((r) => { const i = new Image(); i.onload = () => r((IMG[k] = i)); i.onerror = () => r(null); i.src = src; });
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), rnd = (a, b) => a + Math.random() * (b - a), pick = (a) => a[Math.floor(Math.random() * a.length)];
const F = (w, s) => `${w} ${s}px "Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif`;
const rr = (x, y, w, h, r) => { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); };
let AC = null; const snd = (f, d = 0.08, type = "square", g = 0.03) => { try { AC ||= new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), v = AC.createGain(); o.type = type; o.frequency.value = f; v.gain.value = g; o.connect(v); v.connect(AC.destination); o.start(); v.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch {} };
const DAILY_MAX = 5, FREE = /[?&]free=1/.test(location.search), PK = "vf-hoop-plays";
const dayKey = () => { const d = new Date(Date.now() - 5 * 3600e3); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const playsOf = () => { const p = ls.get(PK, null); return p && p.d === dayKey() ? p.n : 0; };
const canPlay = () => FREE || playsOf() < DAILY_MAX, usePlay = () => { if (!FREE) ls.set(PK, { d: dayKey(), n: playsOf() + 1 }); };
const leftTxt = () => (FREE ? "" : `오늘 ${DAILY_MAX - playsOf()}판 남음`);

// ── 수치 ──
const R = 26;                                  // 공 반지름
const G = 0.47, JUMP = -10.2; // 10/28 "너무 어려워졌다" → 규칙(아래서 막힘, 바닥부터 다시)은 두고 속도, 시간만 다시 느슨하게                  // 중력, 탭 한 번에 튀어 오르는 힘
const VX = 3.1; // 10/28 "너무 쉽잖아" → 한 단계 올림                                // 옆으로 흐르는 속도
const RIM_W = 78, RIM_R = 5;                   // 림 안쪽 너비, 림 끝 두께
const BOARD_H = 96, BOARD_W = 10;              // 백보드
const TLIM0 = 6.5, TLIM_MIN = 3.5;                 // 골 하나당 시간(초), 점수 오르면 조금씩 짧아짐
const BOUNCE = 0.62;                           // 백보드, 림에 맞을 때 튕김

let cool = false; // 10/28 사장님 "공중에서 다시 시작하니 너무 쉬움": 골 넣으면 공이 바닥까지 떨어진 뒤에야 다음 골대가 나오고 탭이 먹음
let state = "ready", t = 0, score = 0, best = ls.get("vf-hoop-best", 0), ball, hoop, timer = 0, tlim = TLIM0, combo = 0, pops = [], deadT = 0, shake = 0, netT = 0, why = "";
function newHoop(side) {
  const y = rnd(200, 540);
  const x1 = side === "L" ? 62 : W - 62 - RIM_W, x2 = x1 + RIM_W;
  hoop = { side, y, x1, x2, bx: side === "L" ? x1 - BOARD_W - 2 : x2 + 2, touched: false, scored: false };
  ball.vx = side === "L" ? -VX : VX; // 공은 골대 쪽으로 흐름
}
function reset() {
  t = 0; score = 0; combo = 0; pops = []; shake = 0; netT = 0; why = ""; cool = false;
  ball = { x: W / 2, y: FLOOR - R, vx: 0, vy: 0, ang: 0, prevY: FLOOR - R };
  newHoop("R"); tlim = TLIM0; timer = tlim * 60; state = "run"; tap();
}
function tap() { if (state !== "run" || cool) return; ball.vy = JUMP; snd(420, 0.06, "triangle", 0.025); }
function pop(text, x, y, c) { pops.push({ text, x, y, c, t: 0 }); }
function die(reason) { state = "dead"; why = reason; deadT = performance.now(); shake = 10; snd(160, 0.35, "sawtooth", 0.04); if (score > best) { best = score; ls.set("vf-hoop-best", best); } }

// ── 입력 ──
const T0 = performance.now(); // 켜자마자 들어오는 눌림(브라우저가 띄우면서 보내는 클릭)은 무시
function start() { if (state === "limit") return; if (performance.now() - T0 < 600) return; if (state === "dead" && performance.now() - deadT < 600) return; if (!canPlay()) { state = "limit"; return; } usePlay(); reset(); }
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); if (state !== "run") return start(); tap(); });
addEventListener("keydown", (e) => { if (e.code === "Space" || e.code === "Enter" || e.code === "ArrowUp") { e.preventDefault(); state === "run" ? tap() : start(); } });

// ── 진행 ──
function step() {
  if (state !== "run") return;
  t++; if (!cool) { timer--; if (timer <= 0) return die("시간 끝"); }
  const b = ball; b.prevY = b.y;
  b.vy += G; b.y += b.vy; b.x += b.vx; b.ang += b.vx * 0.045;
  if (b.y < -140) { b.y = -140; b.vy = Math.max(0, b.vy); }
  if (b.x < -R) b.x = W + R; else if (b.x > W + R) b.x = -R; // 화면 끝 → 반대편
  if (b.y + R > FLOOR) { b.y = FLOOR - R; if (b.vy > 1.5) snd(180, 0.05, "square", 0.02); b.vy = -b.vy * 0.45; if (Math.abs(b.vy) < 1) b.vy = 0;
    if (cool) { cool = false; b.vy = 0; newHoop(hoop.side === "L" ? "R" : "L"); timer = Math.round(tlim * 60); } } // 평평한 바닥에서 튕김. 골 뒤엔 바닥에 닿아야 다음 골대
  const h = hoop;
  // 백보드: 공이 보드 면에 맞으면 x 방향 튕김(뱅크슛)
  const bTop = h.y - BOARD_H, bBot = h.y + 10;
  if (b.y + R > bTop && b.y - R < bBot) {
    if (h.side === "R" && b.x + R > h.bx && b.x < h.bx + BOARD_W + R && b.vx > 0) { b.x = h.bx - R; b.vx = -b.vx * BOUNCE; snd(220, 0.05, "square", 0.02); }
    if (h.side === "L" && b.x - R < h.bx + BOARD_W && b.x > h.bx - R && b.vx < 0) { b.x = h.bx + BOARD_W + R; b.vx = -b.vx * BOUNCE; snd(220, 0.05, "square", 0.02); }
  }
  // 10/28 사장님 "반대로 들어가면 안 되고": 아래에서 위로는 그물이 막음(림 선을 위로 못 지나감)
  if (!h.scored && b.vy < 0 && b.prevY - R >= h.y - 1 && b.y - R < h.y && b.x > h.x1 - 4 && b.x < h.x2 + 4) { b.y = h.y + R; b.vy = Math.abs(b.vy) * 0.3; h.touched = true; snd(260, 0.05, "square", 0.02); }
  // 10/28 사장님 "골대 맞고 튕기는 게 필요": 림 양 끝(두툼한 링)과 백보드까지 이어진 받침대는 선분으로 충돌, 맞으면 튕김
  const hitSeg = (ax, ay, bx, by, rad) => {
    const vx = bx - ax, vy = by - ay, L2 = vx * vx + vy * vy || 1, u = clamp(((b.x - ax) * vx + (b.y - ay) * vy) / L2, 0, 1), px = ax + vx * u, py = ay + vy * u;
    const dx = b.x - px, dy = b.y - py, d = Math.hypot(dx, dy), min = R + rad;
    if (d >= min || d === 0) return false;
    const nx = dx / d, ny = dy / d, dot = b.vx * nx + b.vy * ny;
    b.x = px + nx * min; b.y = py + ny * min;
    if (dot < 0) { b.vx -= (1 + BOUNCE) * dot * nx; b.vy -= (1 + BOUNCE) * dot * ny; b.vx += (Math.random() - 0.5) * 0.8; } // 링은 둥글어서 살짝 제멋대로 튕김
    return true;
  };
  let rimHit = false;
  for (const rx of [h.x1, h.x2]) if (hitSeg(rx, h.y, rx, h.y, RIM_R + 2)) rimHit = true; // 링 양 끝(두툼하게)
  if (h.side === "L" ? hitSeg(h.bx + BOARD_W, h.y, h.x1, h.y, RIM_R) : hitSeg(h.x2, h.y, h.bx, h.y, RIM_R)) rimHit = true; // 받침대
  if (rimHit) { h.touched = true; snd(300, 0.04, "square", 0.02); }
  // 득점: 위에서 아래로 림 선을 통과
  if (!h.scored && b.vy > 0 && b.prevY <= h.y && b.y > h.y && b.x > h.x1 + 8 && b.x < h.x2 - 8) {
    h.scored = true; const swish = !h.touched;
    if (swish) combo++; else combo = 0;
    const pts = swish ? (combo >= 3 ? 3 : 2) : 1; score += pts; netT = 20;
    pop(swish ? (combo >= 3 ? `스위시 x${combo} +${pts}` : `스위시 +${pts}`) : "+1", (h.x1 + h.x2) / 2, h.y - 40, swish ? "#e8262f" : "#191f28");
    snd(880, 0.08, "triangle", 0.03); setTimeout(() => snd(swish ? 1320 : 1100, 0.12, "triangle", 0.03), 70);
    tlim = Math.max(TLIM_MIN, TLIM0 - score * 0.08); cool = true; // 바닥에 닿으면 다음 골대 + 시간 다시
    b.vy = -7.5; b.vx = (h.side === "L" ? 1 : -1) * VX * 1.5; // 10/28 사장님 "포물선으로 떨어지게": 그물을 통과하며 살짝 튀어 올라 반대편으로 포물선 낙하
  }
  // 흐르는 방향이 튕겨서 바뀌었으면 천천히 골대 쪽으로 되돌림
  // 10/28 사장님 "밑에서 시작하게만 하고, 공이 수직으로 낙하하는 것만 막아줘": 골 뒤에도 옆으로 계속 흐르며 떨어짐(멈추지 않음)
  const want = (cool ? -1 : 1) * (h.side === "L" ? -VX : VX); if (Math.sign(b.vx) !== Math.sign(want) || Math.abs(b.vx) < VX) b.vx += (want - b.vx) * 0.04; // 골 뒤엔 반대편(다음 골대 쪽)으로
  for (const p of pops) p.t++; pops = pops.filter((p) => p.t < 50);
  if (netT > 0) netT--;
}

// ── 그림 ──
function drawBg() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#fbf4ea"); g.addColorStop(1, "#f0e2cc"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (IMG.logo) { ctx.save(); ctx.globalAlpha = 0.14; ctx.globalCompositeOperation = "multiply"; ctx.drawImage(IMG.logo, W / 2 - 190, 290, 380, 380); ctx.restore(); } // 배경 워터마크 로고
  ctx.strokeStyle = "rgba(160,120,80,.18)"; ctx.lineWidth = 2; for (let i = 1; i < 9; i++) { ctx.beginPath(); ctx.moveTo(0, i * 90); ctx.lineTo(W, i * 90); ctx.stroke(); }
  ctx.fillStyle = "#d9b98f"; ctx.fillRect(0, FLOOR, W, H - FLOOR); ctx.fillStyle = "#c4a176"; ctx.fillRect(0, FLOOR, W, 6);
  ctx.strokeStyle = "rgba(200,60,60,.35)"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(W / 2, FLOOR, 120, Math.PI, 0); ctx.stroke();
}
function drawHoop() {
  const h = hoop, cx = (h.x1 + h.x2) / 2;
  // 백보드
  ctx.fillStyle = "#fff"; ctx.strokeStyle = "#e8262f"; ctx.lineWidth = 4; rr(h.bx, h.y - BOARD_H, BOARD_W, BOARD_H + 12, 3); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#c9ced6"; ctx.fillRect(h.side === "L" ? 0 : h.bx + BOARD_W, h.y - 30, h.side === "L" ? h.bx : W - h.bx - BOARD_W, 8); // 벽 고정대
  // 그물
  const sw = netT > 0 ? Math.sin(netT * 0.6) * 6 : 0, nb = h.y + 56;
  ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.lineWidth = 2;
  for (let i = 0; i <= 6; i++) { const x = h.x1 + (RIM_W / 6) * i, xb = cx + (x - cx) * 0.7 + sw; ctx.beginPath(); ctx.moveTo(x, h.y); ctx.lineTo(xb, nb); ctx.stroke(); }
  for (let k = 1; k <= 3; k++) { const yy = h.y + (nb - h.y) * (k / 3), s = 1 - 0.3 * (k / 3); ctx.beginPath(); ctx.moveTo(cx + (h.x1 - cx) * s + sw * (k / 3), yy); ctx.lineTo(cx + (h.x2 - cx) * s + sw * (k / 3), yy); ctx.stroke(); }
  // 림
  ctx.strokeStyle = "#e8262f"; ctx.lineWidth = RIM_R * 2; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(h.x1, h.y); ctx.lineTo(h.x2, h.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(h.side === "L" ? h.bx + BOARD_W : h.x2, h.y); ctx.lineTo(h.side === "L" ? h.x1 : h.bx, h.y); ctx.stroke();
}
function drawBall() {
  const b = ball;
  ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.beginPath(); ctx.ellipse(b.x, FLOOR + 3, R * (0.5 + 0.5 * clamp(1 - (FLOOR - b.y) / 700, 0, 1)), 6, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang);
  const g = ctx.createRadialGradient(-8, -8, 4, 0, 0, R); g.addColorStop(0, "#ffa548"); g.addColorStop(1, "#e2651a");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  // 농구공 줄(로고 뒤에)
  ctx.strokeStyle = "#3a2411"; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-R, 0); ctx.lineTo(R, 0); ctx.moveTo(0, -R); ctx.lineTo(0, R); ctx.stroke();
  ctx.beginPath(); ctx.arc(-R * 1.15, 0, R * 0.95, -0.9, 0.9); ctx.stroke(); ctx.beginPath(); ctx.arc(R * 1.15, 0, R * 0.95, Math.PI - 0.9, Math.PI + 0.9); ctx.stroke();
  // 10/28 사장님 "난 배경에만 있는 게 좋아" → 공에는 로고 없음(배경 워터마크만)
  ctx.restore();
}
function drawUI() {
  ctx.fillStyle = "#191f28"; ctx.font = F(800, 34); ctx.textAlign = "center"; ctx.fillText(String(score), W / 2, 54);
  ctx.fillStyle = "#8b95a1"; ctx.font = F(700, 13); ctx.fillText(`최고 ${best}${combo >= 2 ? "   스위시 " + combo + "연속" : ""}`, W / 2, 76);
  if (state === "run") { const w = W - 80, p = clamp(timer / (tlim * 60), 0, 1); ctx.fillStyle = "#e5e8eb"; rr(40, 92, w, 8, 4); ctx.fill(); ctx.fillStyle = p < 0.3 ? "#e8262f" : "#3182f6"; rr(40, 92, Math.max(8, w * p), 8, 4); ctx.fill(); }
  for (const p of pops) { ctx.globalAlpha = Math.max(0, 1 - p.t / 50); ctx.font = F(800, 20); ctx.textAlign = "center"; ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - p.t * 0.8); ctx.globalAlpha = 1; }
  if (state === "limit") panel("오늘은 여기까지", `하루 ${DAILY_MAX}판이에요`, "내일 새벽 5시 지나면 다시 할 수 있어요", "");
  if (state === "ready") panel("탭탭 농구", leftTxt() || "시험판", "탭하면 공이 튀어 올라요. 골대를 위에서 통과하면 득점, 림을 안 건드리면 스위시 2점. 골을 넣으면 공이 바닥에 닿은 뒤 다음 골대가 나오고, 시간이 다 되면 끝", "탭해서 시작");
  if (state === "dead") panel(why, `${score}점${score >= best && score > 0 ? ", 최고 기록!" : `, 최고 ${best}점`}`, (leftTxt() || "시험판"), performance.now() - deadT > 600 ? "탭해서 다시" : "");
  ctx.textAlign = "left";
}
function panel(h1, h2, h3, h4) {
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "rgba(255,255,255,.96)"; rr(40, 280, W - 80, 230, 24); ctx.fill();
  ctx.textAlign = "center"; ctx.fillStyle = "#191f28"; ctx.font = F(800, 30); ctx.fillText(h1, W / 2, 335);
  ctx.fillStyle = "#3182f6"; ctx.font = F(700, 18); ctx.fillText(h2, W / 2, 372);
  ctx.fillStyle = "#8b95a1"; ctx.font = F(500, 14); wrap(h3, W / 2, 404, W - 130, 20);
  ctx.fillStyle = "#191f28"; ctx.font = F(800, 16); ctx.fillText(h4, W / 2, 480);
}
function wrap(txt, x, y, maxW, lh) { const words = txt.split(" "); let line = ""; for (const w of words) { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { ctx.fillText(line, x, y); y += lh; line = w; } else line = test; } if (line) ctx.fillText(line, x, y); }
function frame() {
  step();
  ctx.save();
  if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.85; if (shake < 0.5) shake = 0; }
  drawBg(); if (hoop) { if (cool) ctx.globalAlpha = 0.35; drawHoop(); ctx.globalAlpha = 1; } if (ball) drawBall();
  ctx.restore(); drawUI();
  requestAnimationFrame(frame);
}
ball = { x: W / 2, y: FLOOR - R, vx: 0, vy: 0, ang: 0, prevY: FLOOR - R }; newHoop("R"); ball.vx = 0;
// 흰 배경 빨간 로고 PNG → 흰색 로고(배경 투명)로 바꿈: 흰 정도가 낮을수록(빨강) 불투명
function whiteLogo(im) { const c = document.createElement("canvas"); c.width = im.width; c.height = im.height; const x = c.getContext("2d"); x.drawImage(im, 0, 0); const d = x.getImageData(0, 0, c.width, c.height), p = d.data; for (let i = 0; i < p.length; i += 4) { const a = 255 - Math.min(p[i], p[i + 1], p[i + 2]); p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.min(255, a * 1.3); } x.putImageData(d, 0, 0); return c; }
load("logo", "img/vf_logo.png").then((im) => { if (im) IMG.logoW = whiteLogo(im); frame(); });
