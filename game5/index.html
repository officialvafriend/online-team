<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<title>액상 받기</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#15181f;font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:#fff}
  canvas{display:block;width:100vw;height:100vh}
  .hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:14px;align-items:center;font-weight:800;pointer-events:none}
  .hud b{font-size:30px;font-variant-numeric:tabular-nums}.hud span{font-size:13px;color:#aab}
  .phase{position:fixed;top:30%;left:0;right:0;text-align:center;font-size:22px;font-weight:800;color:#ffd166;text-shadow:0 2px 8px rgba(0,0,0,.6);opacity:0;transition:opacity .25s;pointer-events:none}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(10,12,18,.72);text-align:center;padding:24px}
  .ov h1{font-size:28px}.ov p{color:#cfd3dc;font-size:15px;line-height:1.55}.ov .big{font-size:54px;font-weight:900;color:#fff}
  .ov button{margin-top:6px;background:#ff6b6b;color:#fff;border:0;border-radius:14px;padding:14px 28px;font-size:17px;font-weight:800}.ov button:disabled{background:#555;color:#aaa}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><b id="sc">0</b><span id="tm">0.0초</span><span id="left"></span></div>
<div class="phase" id="ph"></div>
<div class="ov" id="ov"></div>
<script>
// 액상 받기 (10/29 사장님: 연기 피하기만큼 어렵고 보통은 30초쯤이 한계, 진짜 잘하면 30초를 넘길 수 있게)
// 위에서 떨어지는 빌런 자두(우리 액상)를 하치와레가 좌우로 움직여 받고, 멘솔쨩 스모모(타사 액상, 빨간 ✕)는 피함.
// 목숨 3개: 자두를 놓치거나 스모모를 받으면 하나 깎임. 점수 = 받은 자두 개수. 난이도는 30초쯤까지 계속 오르고 그 뒤는 그대로(여기서 버티면 기록이 쭉 늘어남)
// 직원웹 안(?embed=1): 판 수와 기록은 직원웹, 봇이 맡음. 한 번 열면 한 판, 끝나면 점수를 보내고 [닫기]. 혼자 열면 하루 5판(기기), ?free=1 이면 무제한(시험용)
const $ = (id) => document.getElementById(id), cv = $("c"), ctx = cv.getContext("2d");
let DPR = 1, W = 420, H = 840, SW, SH, OX, OY;
function fit() { DPR = Math.min(2, devicePixelRatio || 1); SW = innerWidth; SH = innerHeight; cv.width = SW * DPR; cv.height = SH * DPR; W = Math.min(SW, 420); H = Math.min(SH, 840); OX = (SW - W) / 2; OY = (SH - H) / 2; ctx.setTransform(DPR, 0, 0, DPR, 0, 0); }
addEventListener("resize", fit); fit();
const EMBED = new URLSearchParams(location.search).get("embed") === "1", FREE = /[?&]free=1/.test(location.search), tell = (m) => { try { parent.postMessage({ vfGame: 1, ...m }, "*"); } catch {} };
const dayKey = () => { const d = new Date(Date.now() - 5 * 3600e3); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
const KEY = "vf-catch-" + dayKey(), MAX = 5;
const ls = { get: (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const used = () => (FREE ? 0 : ls.get(KEY, 0)), best = () => ls.get("vf-catch-best", 0);
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let AC = null; const snd = (f, d = 0.08, type = "square", g = 0.03) => { try { AC ||= new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), v = AC.createGain(); o.type = type; o.frequency.value = f; v.gain.value = g; o.connect(v); v.connect(AC.destination); o.start(); v.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d); o.stop(AC.currentTime + d); } catch {} };
const IMG = {}; const load = (k, src) => new Promise((r) => { const i = new Image(); i.onload = () => r((IMG[k] = i)); i.onerror = () => r(null); i.src = src; });

// ── 수치 ──
const FLOOR_PAD = 40;                                    // 바닥 여백
const BODY_H = 62, LEG = 64, HIT_W = 36;                 // 하치와레 몸통, 긴 다리, 받는 폭(절반)
const BOT_H = 60;                                        // 병 높이(그림은 비율대로)
const rate = (s) => Math.max(0.36, 0.95 * Math.pow(0.968, s));       // 몇 초마다 하나: 0.95 → 30초쯤 0.36에서 멈춤(완벽 자동이 32초에 죽어서 한 번 늦춤)
const speed = (s) => Math.min(400, 170 + s * 7.7);                   // 낙하 px/초: 170 → 30초 400에서 멈춤
const badRatio = (s) => Math.min(0.33, 0.12 + s * 0.007);            // 스모모 비율: 12% → 30초 33%에서 멈춤
const driftAt = 14;                                                  // 이 초부터 병이 옆으로도 흐름
const LIVES = 3;

let bottles = [], parts = [], pops = [], t = 0, last = 0, run = false, spawnT = 0, lives = LIVES, score = 0, combo = 0, shake = 0, stun = 0, face = "base", faceT = 0, nextPhase = 10;
const P = { x: 0 };
let drag = null, mouse = null; const keys = {};
const FLOOR = () => H - FLOOR_PAD;
function phaseMsg(txt) { const el = $("ph"); el.textContent = txt; el.style.opacity = 1; setTimeout(() => (el.style.opacity = 0), 900); }
function pop(text, x, y, c) { pops.push({ text, x, y, c, t: 0 }); }
function setFace(f, ms) { face = f; faceT = performance.now() + ms; }

function start() {
  if (!EMBED) { if (used() >= MAX) return; if (!FREE) ls.set(KEY, used() + 1); } else { if (window.__played) return; window.__played = 1; tell({ t: "start" }); }
  P.x = W / 2; bottles = []; parts = []; pops = []; t = 0; spawnT = 0.8; lives = LIVES; score = 0; combo = 0; shake = 0; stun = 0; face = "base"; nextPhase = 10;
  $("ov").style.display = "none"; run = true; last = performance.now(); snd(600, 0.1, "triangle"); requestAnimationFrame(loop);
}
function over() {
  run = false; shake = 14; setFace("error", 3000);
  const b = best(); if (score > b) ls.set("vf-catch-best", score);
  if (EMBED) tell({ t: "score", s: score });
  snd(160, 0.35, "sawtooth", 0.04);
  setTimeout(() => menu(score, score > b), 800);
}
function spawn(s) {
  const bad = Math.random() < badRatio(s), x = rnd(30, W - 30);
  bottles.push({ x, y: -BOT_H, bad, vx: s > driftAt ? rnd(-1, 1) * Math.min(90, (s - driftAt) * 6) : 0, w: 36, h: BOT_H, rot: rnd(-0.12, 0.12) });
  if (s > 25 && Math.random() < Math.min(0.3, (s - 25) * 0.03)) bottles.push({ x: clamp(x + rnd(-1, 1) * rnd(90, 160), 30, W - 30), y: -BOT_H - rnd(40, 120), bad: Math.random() < badRatio(s), vx: 0, w: 36, h: BOT_H, rot: rnd(-0.12, 0.12) }); // 22초부터 가끔 둘씩
}
function loseLife(why, x, y) {
  lives--; combo = 0; shake = 10; stun = why === "bad" ? 0.5 : 0.2; setFace("error", 700);
  pop(why === "bad" ? "스모모 ✕" : "놓침", x, y, "#ff5a6a"); snd(why === "bad" ? 140 : 220, 0.18, "sawtooth", 0.035);
  if (lives <= 0) over();
}
function step(dt) {
  t += dt; const s = t;
  if (s >= nextPhase) { phaseMsg(nextPhase === 10 ? "빨라져요" : nextPhase === 20 ? "스모모가 늘어요" : nextPhase === 30 ? "여기부터 진짜" : `${nextPhase}초, 레전드`); nextPhase += 10; }
  if (stun > 0) stun -= dt;
  // 조작: 끌기, 마우스, 키보드
  if (stun <= 0) {
    if (mouse) P.x += (mouse.x - P.x) * Math.min(1, dt * 14);
    if (keys.arrowleft || keys.a) P.x -= 520 * dt; if (keys.arrowright || keys.d) P.x += 520 * dt;
  }
  P.x = clamp(P.x, 30, W - 30);
  spawnT -= dt; if (spawnT <= 0) { spawn(s); spawnT = rate(s); }
  const hipY = FLOOR() - LEG, top = hipY - BODY_H;
  for (const b of bottles) {
    b.y += speed(s) * dt; b.x += b.vx * dt; if (b.x < 20 || b.x > W - 20) b.vx = -b.vx;
    const bottom = b.y + b.h / 2;
    if (!b.done && bottom > top && b.y < hipY + 10 && Math.abs(b.x - P.x) < HIT_W) {
      b.done = true;
      if (b.bad) loseLife("bad", b.x, b.y);
      else { score++; combo++; setFace("peace", 500); pop(combo >= 5 ? `+1 ${combo}연속` : "+1", b.x, b.y - 10, "#8ef0a1"); snd(700 + Math.min(600, combo * 40), 0.07, "triangle", 0.03); }
    }
    if (!b.done && b.y - b.h / 2 > FLOOR()) { b.done = true; if (!b.bad) loseLife("miss", b.x, FLOOR() - 20); }
  }
  bottles = bottles.filter((b) => !b.done && b.y < H + 80);
  for (const p of pops) p.t += dt; pops = pops.filter((p) => p.t < 0.8);
}

// ── 그림 ──
function drawBottle(b) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
  const im = b.bad ? IMG.bad : IMG.good;
  if (im) { const h = b.h, w = im.width * (h / im.height); ctx.drawImage(im, -w / 2, -h / 2, w, h); }
  else { // 그림 없을 때 그리는 병(스모모 이미지 받기 전 임시)
    ctx.fillStyle = b.bad ? "#5fd3e6" : "#ff7aa8"; ctx.strokeStyle = "#222"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-14, -18, 28, 40, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(-8, -30, 16, 14, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#222"; ctx.font = "800 9px sans-serif"; ctx.textAlign = "center"; ctx.fillText(b.bad ? "스모모" : "자두", 0, 6);
  }
  if (b.bad) { ctx.fillStyle = "#ff3b4b"; ctx.beginPath(); ctx.arc(16, -b.h / 2 + 8, 9, 0, 7); ctx.fill(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(12, -b.h / 2 + 4); ctx.lineTo(20, -b.h / 2 + 12); ctx.moveTo(20, -b.h / 2 + 4); ctx.lineTo(12, -b.h / 2 + 12); ctx.stroke(); }
  ctx.restore();
}
function drawHachi() {
  const x = P.x, fl = FLOOR(), hipY = fl - LEG, sway = Math.sin(t * 9) * (mouse || drag ? 4 : 1.5);
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x, fl + 4, 30, 6, 0, 0, 7); ctx.fill();
  for (const [dx, s] of [[-8, 1], [8, -1]]) { ctx.strokeStyle = "#222"; ctx.lineWidth = 11; ctx.lineCap = "round"; ctx.beginPath(); ctx.moveTo(x + dx, hipY); ctx.lineTo(x + dx + sway * s, fl - 4); ctx.stroke(); ctx.strokeStyle = "#fff"; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x + dx, hipY); ctx.lineTo(x + dx + sway * s, fl - 6); ctx.stroke(); }
  const im = IMG[performance.now() < faceT ? face : "base"] || IMG.base;
  if (im) { const h = BODY_H, w = im.width * (h / im.height); ctx.save(); if (stun > 0) ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 40); ctx.drawImage(im, x - w / 2, hipY - h + 10, w, h); ctx.restore(); }
  // 받는 범위 살짝 표시(바구니 느낌 선)
  ctx.strokeStyle = "rgba(255,255,255,.18)"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x - HIT_W, hipY + 6); ctx.lineTo(x + HIT_W, hipY + 6); ctx.stroke();
}
function draw() {
  ctx.clearRect(0, 0, SW, SH);
  ctx.save(); ctx.translate(OX, OY);
  if (shake > 0) { ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); shake *= 0.86; if (shake < 0.4) shake = 0; }
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#1c2130"); g.addColorStop(1, "#2a2f3f"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#3a3346"; ctx.fillRect(0, FLOOR(), W, H - FLOOR()); ctx.fillStyle = "#4a4258"; ctx.fillRect(0, FLOOR(), W, 5);
  for (const b of bottles) drawBottle(b);
  drawHachi();
  for (const p of pops) { ctx.globalAlpha = Math.max(0, 1 - p.t / 0.8); ctx.font = "800 18px sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = p.c; ctx.fillText(p.text, p.x, p.y - p.t * 60); ctx.globalAlpha = 1; }
  // 목숨
  ctx.font = "20px sans-serif"; ctx.textAlign = "left"; for (let i = 0; i < LIVES; i++) ctx.fillText(i < lives ? "❤️" : "🖤", 12 + i * 26, 34);
  ctx.restore();
  $("sc").textContent = String(score); $("tm").textContent = t.toFixed(1) + "초";
}
function loop(now) {
  if (!run) { draw(); return; }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); draw(); requestAnimationFrame(loop);
}

// ── 입력 ──
addEventListener("keydown", (e) => { keys[e.key.toLowerCase()] = 1; if ((e.key === " " || e.key === "Enter") && !run) { const g = $("go"); if (g && !g.disabled) g.click(); } });
addEventListener("keyup", (e) => { keys[e.key.toLowerCase()] = 0; });
cv.addEventListener("pointerdown", (e) => { if (e.pointerType === "mouse") return; drag = { x: e.clientX, px: P.x }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => { if (e.pointerType === "mouse") { mouse = { x: e.clientX - OX }; return; } if (!drag || !run || stun > 0) return; P.x = clamp(drag.px + (e.clientX - drag.x) * 1.2, 30, W - 30); });
addEventListener("pointerup", () => (drag = null)); addEventListener("pointercancel", () => (drag = null));

function menu(sc, nb) {
  const ov = $("ov"), rule = `폰은 화면을 끌고, PC는 마우스나 방향키로 움직여요.<br>떨어지는 <b style="color:#ff9ac0">빌런 자두</b>는 받고, <b style="color:#7fe3f2">멘솔쨩 스모모(✕)</b>는 피해요.<br>놓치거나 스모모를 받으면 ❤️ 하나, 셋 다 잃으면 끝. 받은 개수가 점수예요.`;
  if (EMBED) { $("left").textContent = "";
    ov.innerHTML = sc == null ? `<h1>🍑 액상 받기</h1><p>${rule}</p><button id="go">시작 (1판 씀)</button>`
      : `<p>${nb ? "🎉 이 기기 최고 기록!" : "받은 자두"}</p><div class="big">${sc}개</div><p>${t.toFixed(1)}초 버텼어요, 기록은 랭킹에 올라가요</p><button id="go">닫기</button>`;
    ov.style.display = "flex"; $("go").onclick = sc == null ? start : () => tell({ t: "close" }); return; }
  const left = MAX - used();
  ov.innerHTML = sc == null
    ? `<h1>🍑 액상 받기</h1><p>${rule}</p><p>${FREE ? "시험판(무제한)" : `오늘 남은 판 <b style="color:#fff">${left}/${MAX}</b>`}${best() ? `, 내 최고 ${best()}개` : ""}</p><button id="go" ${left ? "" : "disabled"}>${left ? "시작" : "오늘은 끝! 내일 새벽 5시 이후"}</button>`
    : `<p>${nb ? "🎉 내 최고 기록!" : "받은 자두"}</p><div class="big">${sc}개</div><p>${t.toFixed(1)}초 버텼어요, 내 최고 ${best()}개<br>${FREE ? "" : `오늘 남은 판 <b style="color:#fff">${left}/${MAX}</b>`}</p><button id="go" ${left ? "" : "disabled"}>${left ? "한 판 더" : "오늘은 끝! 내일 새벽 5시 이후"}</button>`;
  ov.style.display = "flex"; $("left").textContent = FREE ? "" : `남은 판 ${left}`; $("go").onclick = start;
}
Promise.all([load("base", "img/hachi_base.png"), load("peace", "img/hachi_peace.png"), load("error", "img/hachi_error.png"), load("good", "img/villain_plum.png"), load("bad", "img/menthol_smomo.png")]).then(() => { P.x = W / 2; draw(); menu(null); });
</script>
</body>
</html>
