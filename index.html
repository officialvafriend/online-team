<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>온라인팀 보드</title>
<!-- 폰 홈 화면에 "온라인팀" 앱 아이콘으로 따로 설치 (새 VF 로고 흰색 + 민트) -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 베이프렌드 관리자 웹 틀(10/26)을 그대로 두고 색만 민트로. 숫자카드, 표, 오른쪽 상세는 흰색 유지 */
  :root{--bg:#eef6f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#eef3f3;--line2:#dde8e8;
    --ac:#0f8a8c;--ac-soft:#e0fcfc;--m2:#c8f0f2;--m3:#a4e4ea;--m4:#74cbcd;
    --green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--press:#f5fafa;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--card:#1e2426;--ink:#f9fafb;--ink2:#c3c9d1;--sub:#8b95a1;--line:#283032;--line2:#303a3c;
    --ac:#5fd3d3;--ac-soft:#173638;--m2:#1d4547;--m3:#245658;--m4:#2f6a6c;
    --green:#15c47e;--green-soft:#183027;--red:#ff5b68;--red-soft:#3a2023;--amber:#ffb331;--amber-soft:#3a3020;--press:#242c2e;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  button,input,select,textarea{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;padding:8px 4px 18px}

  .top .r{margin-left:auto;display:flex;gap:4px}
  .ic{height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)} .ic:active{background:var(--line2)}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}

  .caption{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}

  .list{background:var(--card);border-radius:22px;padding:6px 0;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left} .item:active{background:var(--press)}

  .av.good{background:var(--green-soft);color:var(--green)} .av.warn{background:var(--amber-soft);color:var(--amber)} .av.bad{background:var(--red-soft);color:var(--red)} .av.ac{background:var(--ac-soft);color:var(--ac)}
  .item .tx{flex:1;min-width:0} .item .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .val{text-align:right;flex:none} .item .val b{display:block;font-size:15px;font-weight:700} .item .val span{font-size:12px;font-weight:600;color:var(--sub)}
  .t-good{color:var(--green)} .t-warn{color:var(--amber)} .t-bad{color:var(--red)} .t-sub{color:var(--sub)} .t-ac{color:var(--ac)}
  .chev{color:var(--line2);font-size:18px;flex:none;margin-left:-4px}
  .empty{padding:18px 20px;color:var(--sub);font-size:14px}
  .btn{height:56px;border-radius:16px;font-weight:700;font-size:17px;background:var(--ac);color:#fff;width:100%}

  .sheet{background:var(--card);width:min(560px,100%);border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}

  .lbl{font-size:14px;font-weight:600;color:var(--sub);margin:22px 0 10px} .lbl small{font-weight:500}

  .st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
  .st.후보{background:var(--line);color:var(--ink2)} .st.확인필요{background:var(--amber-soft);color:var(--amber)} .st.시도{background:var(--m2);color:var(--ac)}

  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;z-index:60;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#191f28;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:70;max-width:90vw;text-align:center} .toast.on{opacity:1;transform:translateX(-50%)}
  .login{padding-top:14vh} .login .headline{margin-bottom:28px}
  .warn{color:var(--red);font-weight:600;background:var(--red-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.5}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin:0 4px} .dot.ok{background:var(--green)} .dot.warn{background:var(--amber);padding:0;margin:0 4px;border-radius:50%}
  .item.iss{min-height:52px}

  .ops{width:100%;border-collapse:collapse;font-size:14px}

  .ops th:first-child,.ops td:first-child{text-align:left}

  .ops tr:last-child td{border-bottom:0} .ops td b{font-weight:700} .ops tr.cl{cursor:pointer} .ops tr.cl:hover td{background:var(--press)}
  .ops .g{color:var(--green);font-weight:700} .ops .r{color:var(--red);font-weight:700} .ops .n{color:var(--sub)}
  .ops small{display:block;font-size:11px;color:var(--sub);font-weight:500}
  .ops tr.tot td{border-top:1px solid var(--line2);background:var(--press)}
  .log{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5} .log:last-child{border-bottom:0} .log small{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
  .mline{display:flex;gap:8px;align-items:center;margin-top:10px} .mline .in{height:46px;font-size:15px} .mline .btn{width:auto;height:46px;padding:0 16px;font-size:15px;border-radius:12px;flex:none}
  .num{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1} .num small{font-size:15px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}

  .kpi{background:var(--card);border-radius:22px;padding:20px 20px 18px;min-height:110px;text-align:left;display:block;width:100%}

  .gwrap{display:grid;gap:12px} .gside,.gmain{min-width:0}
  .mhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap} .mhead .tx{flex:1;min-width:0} .mhead .ic{flex:none;background:var(--line);height:38px;border-radius:12px}
  .bulk{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}

  .board{display:grid;gap:12px} .board .col{background:var(--card);border-radius:22px;padding:16px 0 6px;min-width:0} .board .col h4{font-size:16px;font-weight:800;padding:0 18px 8px;display:flex;gap:6px;align-items:baseline} .board .col h4 small{font-size:13px;color:var(--sub);font-weight:600} .board .col.me{box-shadow:inset 0 0 0 2px var(--ac)}
  .bcard{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:12px 18px;border-top:1px solid var(--line)} .bcard:hover{background:var(--press)} .bcard b{display:block;font-size:15px;line-height:1.4;font-weight:700} .bcard small{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:13px;color:var(--sub)} .bcard .bst{color:var(--amber);font-weight:700}
  .bmore{all:unset;cursor:pointer;display:block;padding:12px 18px;font-size:14px;font-weight:700;color:var(--ac);border-top:1px solid var(--line)}
  .board .item{padding:11px 18px;gap:6px 10px;flex-wrap:wrap} .board .item .tx{flex:1 1 100%} .board .item .tx b{white-space:normal;font-size:15px;line-height:1.35}
  .board .item .val{display:flex;flex-wrap:wrap;align-items:center;gap:6px;text-align:left} .board .item .val span{margin:0!important} .board .ppl{margin:0} .board .chev{display:none}
  .opn{margin:-4px 20px 10px 76px;padding:10px 14px;border-radius:14px;background:var(--bg);font-size:14px;line-height:1.55} .opn p{margin:3px 0;display:flex;gap:8px} .opn p b{flex:none;min-width:36px;color:var(--ac);font-weight:700}
  .opn p.idea,.log.idea{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:6px 10px;margin:6px 0 2px} .opn a,.log a{color:var(--ac);font-weight:700}
  .notes{display:grid;gap:10px;margin-bottom:12px} .note{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 18px} .note:active{background:var(--press)}

  .pgrid{display:grid;gap:0 22px}

<script>
// Original bytes live privately in Drive. Messages contain only validated metadata.
const chatPhotos = new Map(), photoJobs = new Set(), photoSends = new Set();
const PHOTO_PATTERN = /\[\[파일:([A-Za-z0-9+/=]+)\]\]/g;
const attachmentCache = new Map();
const previewableImage = mime => /^image\/(jpeg|png|webp|gif|avif|bmp)$/.test(mime);
const fileSize = n => n < 1048576 ? `${Math.ceil(n / 1024)} KB` : `${(n / 1048576).toFixed(1)} MB`;
function encodeAttachment(meta) { return btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(meta)))); }
function decodeAttachment(token) {
  try {
    if (token.length > 4000) return null;
    const m = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(token), c => c.charCodeAt(0))));
    return /^[A-Za-z0-9_-]{10,200}$/.test(m.id) && typeof m.name === 'string' && m.name.length <= 240 && /^[\w.+-]+\/[\w.+-]+$/.test(m.mime) && Number.isInteger(m.size) && m.size > 0 && m.size <= 20 * 1024 * 1024 && /^[a-f0-9]{64}$/.test(m.sha256) ? m : null;
  } catch { return null; }
}
function attachmentHtml(token) {
  const m = decodeAttachment(token); if (!m) return esc('첨부파일 정보를 읽을 수 없어요');
  return `<div class="attachment" data-file-token="${token}">${previewableImage(m.mime) ? `<button class="chat-photo" data-photo-view="${token}" aria-label="사진 크게 보기"><span class="photo-loading">사진 불러오는 중…</span><img data-file-image="${m.id}" alt="${esc(m.name)}" hidden></button>` : '<span class="file-icon" aria-hidden="true">📄</span>'}<span class="file-name">${esc(m.name)}</span><small>${fileSize(m.size)} · 원본</small><button class="file-download" data-file-download="${token}">원본 다운로드</button></div>`;
}
function photoPreview() {
  const p = chatPhotos.get(thSel), busy = photoJobs.has(thSel) || photoSends.has(thSel);
  return p || busy ? `<div class="photo-preview">${p ? `${previewableImage(p.file.type) ? `<img src="${p.url}" alt="보낼 사진">` : '<span class="file-icon">📄</span>'}<span>${esc(p.file.name)}<small>${fileSize(p.file.size)} · 원본 그대로</small></span>` : '<span>파일을 준비하고 있어요…</span>'}<button type="button" data-photo-remove ${busy ? 'disabled' : ''} aria-label="첨부 파일 빼기">✕</button></div>` : '';
}
function updatePhotoPreview() {
  const el = $('#photoPreview'); if (el) el.innerHTML = photoPreview();
  const send = document.querySelector('[data-act="csend"]');
  if (send) { send.disabled = photoJobs.has(thSel) || photoSends.has(thSel); send.textContent = photoSends.has(thSel) ? '보내는 중…' : '보내기'; }
}
function selectChatFile(file) {
  const room = thSel;
  if (!file || !room || photoSends.has(room)) return;
  if (!file.size) return toast('빈 파일은 첨부할 수 없어요');

    if (bytes.length !== m.size || await digestFile(bytes) !== m.sha256) throw new Error('checksum');
    return URL.createObjectURL(new Blob([bytes], { type: m.mime }));

  try { return await job; } catch (e) { attachmentCache.delete(m.id); throw e; }
}

// ── 한 줄 할 일 ── 이름(한섭, 보혜, 시원, 진, 이사님, 성 포함), 날짜(오늘, 내일, 모레, 월~일요일, 다음주 X요일, 11/3, 3일)를 알아서 읽음
const WDK = "일월화수목금토";
function parseQuick(t) {
  let text = " " + t.trim() + " ", owners = [], due = "";
  const names = { ...FULL, ...NICK, 한섭: "한섭", 보혜: "보혜", 시원: "시원", 진: "진" };
  for (const [k, v] of Object.entries(names).sort((a, b) => b[0].length - a[0].length)) {
    const re = new RegExp("(^|[\\s,])" + k + "(님|이|가|는|씨)?(?=[\\s,])", "g");
    if (re.test(text)) { owners.push(v); text = text.replace(re, " "); }
  }
  const base = new Date(today() + "T00:00:00"), plus = (n) => { const d = new Date(base); d.setDate(d.getDate() + n); return ymd(d); };
  const take = (re, fn) => { if (due) return; const m = text.match(re); if (m) { due = fn(m); text = text.replace(m[0], " "); } };
  take(/\s오늘(까지)?\s/, () => plus(0)); take(/\s내일(까지)?\s/, () => plus(1)); take(/\s모레(까지)?\s/, () => plus(2));
  take(/\s다음\s?주\s?([월화수목금토일])(요일)?(까지)?\s/, (m) => { const w = WDK.indexOf(m[1]), d0 = (base.getDay() + 6) % 7; return plus(7 - d0 + ((w + 6) % 7)); });
  take(/\s(이번\s?주\s?)?([월화수목금토일])(요일)(까지)?\s/, (m) => { const w = WDK.indexOf(m[2]); let n = (w - base.getDay() + 7) % 7; if (n === 0) n = 7; return plus(n); });
  take(/\s(\d{1,2})[\/.](\d{1,2})(까지)?\s/, (m) => { let y = base.getFullYear(); const d = `${y}-${pad(+m[1])}-${pad(+m[2])}`; return d < today() ? `${y + 1}-${pad(+m[1])}-${pad(+m[2])}` : d; });
  take(/\s(\d{1,2})일(까지)?\s/, (m) => { const d = new Date(base); d.setDate(+m[1]); if (ymd(d) < today()) d.setMonth(d.getMonth() + 1); return ymd(d); });
  const title = text.replace(/\s+/g, " ").replace(/^(까지|에|은|는)\s/, "").trim();
