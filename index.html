<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<title>온라인팀 보드</title>
<!-- 폰 홈 화면에 "온라인팀" 앱 아이콘으로 따로 설치 (새 VF 로고 흰색 + 민트) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="온라인팀">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 베이프렌드 관리자 웹 틀(10/26)을 그대로 두고 색만 민트로. 숫자카드, 표, 오른쪽 상세는 흰색 유지 */
  :root{--bg:#eef6f6;--card:#fff;--ink:#191f28;--ink2:#4e5968;--sub:#8b95a1;--line:#eef3f3;--line2:#dde8e8;
    --ac:#0f8a8c;--ac-soft:#e0fcfc;--m2:#c8f0f2;--m3:#a4e4ea;--m4:#74cbcd;
    --green:#03b26c;--green-soft:#e5f8ef;--red:#f04452;--red-soft:#fdecee;--amber:#b77700;--amber-soft:#fff4dc;--press:#f5fafa;color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191a;--card:#1e2426;--ink:#f9fafb;--ink2:#c3c9d1;--sub:#8b95a1;--line:#283032;--line2:#303a3c;
    --ac:#5fd3d3;--ac-soft:#173638;--m2:#1d4547;--m3:#245658;--m4:#2f6a6c;
    --green:#15c47e;--green-soft:#183027;--red:#ff5b68;--red-soft:#3a2023;--amber:#ffb331;--amber-soft:#3a3020;--press:#242c2e;color-scheme:dark}}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
  button,input,select,textarea{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer}
  .wrap{max-width:560px;margin:0 auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;padding:8px 4px 18px}
  .top .logo{font-weight:800;font-size:17px} .top .logo b{color:var(--ac)}
  .top .r{margin-left:auto;display:flex;gap:4px}
  .ic{height:34px;padding:0 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink2)} .ic:active{background:var(--line2)}
  .card{background:var(--card);border-radius:22px;padding:22px 20px;margin-bottom:12px}
  .eyebrow{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:8px}
  .headline{font-size:24px;font-weight:700;line-height:1.38;letter-spacing:-.6px} .headline em{font-style:normal;color:var(--ac)} .headline em.r{color:var(--red)}
  .caption{font-size:14px;color:var(--sub);margin-top:8px;line-height:1.5}
  .sec{font-size:18px;font-weight:700;margin:26px 4px 10px;display:flex;align-items:baseline;gap:6px} .sec small{font-size:14px;color:var(--sub);font-weight:600} .sec .rt{margin-left:auto;font-size:13px;font-weight:600;color:var(--sub)}
  .list{background:var(--card);border-radius:22px;padding:6px 0;margin-bottom:12px}
  .item{display:flex;align-items:center;gap:14px;padding:14px 20px;width:100%;text-align:left} .item:active{background:var(--press)}
  .av{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none;background:var(--line);color:var(--ink2)}
  .av.good{background:var(--green-soft);color:var(--green)} .av.warn{background:var(--amber-soft);color:var(--amber)} .av.bad{background:var(--red-soft);color:var(--red)} .av.ac{background:var(--ac-soft);color:var(--ac)}
  .item .tx{flex:1;min-width:0} .item .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .item .tx span{display:block;font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .val{text-align:right;flex:none} .item .val b{display:block;font-size:15px;font-weight:700} .item .val span{font-size:12px;font-weight:600;color:var(--sub)}
  .t-good{color:var(--green)} .t-warn{color:var(--amber)} .t-bad{color:var(--red)} .t-sub{color:var(--sub)} .t-ac{color:var(--ac)}
  .chev{color:var(--line2);font-size:18px;flex:none;margin-left:-4px}
  .empty{padding:18px 20px;color:var(--sub);font-size:14px}
  .btn{height:56px;border-radius:16px;font-weight:700;font-size:17px;background:var(--ac);color:#fff;width:100%}
  .btn.sec2{background:var(--ac-soft);color:var(--ac)} .btn.gray{background:var(--line2);color:var(--ink2)} .btn.red{background:var(--red-soft);color:var(--red)} .btn:disabled{opacity:.4}
  .btns{display:flex;gap:8px;margin-top:20px}
  .nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line2);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:20}
  .nav div{display:flex;width:100%;max-width:560px}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:600;color:var(--sub)} .nav button svg{width:24px;height:24px} .nav button.on{color:var(--ac)}
  .dim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50} .dim.on{display:flex}
  .sheet{background:var(--card);width:min(560px,100%);border-radius:26px 26px 0 0;padding:26px 22px calc(22px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}

  .sheet .list{background:none;padding:0;margin:14px -22px 0} .sheet .item{padding:13px 22px}
  .lbl{font-size:14px;font-weight:600;color:var(--sub);margin:22px 0 10px} .lbl small{font-weight:500}

  textarea.in{height:auto;min-height:96px;padding:14px 16px;line-height:1.5;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{height:40px;padding:0 15px;border-radius:12px;background:var(--line);font-size:15px;font-weight:600;color:var(--ink2)} .chip.on{background:var(--ac);color:#fff}
  .chip.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}

  /* 상태 배지: 글자와 색 같이 */
  .st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;vertical-align:middle}
  .st.후보{background:var(--line);color:var(--ink2)} .st.확인필요{background:var(--amber-soft);color:var(--amber)} .st.시도{background:var(--m2);color:var(--ac)}
  .st.확정{background:var(--ac);color:#fff} .st.완료{background:var(--green-soft);color:var(--green)} .st.보류{background:none;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line2)} .st.제외{background:var(--red-soft);color:var(--red)}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;font-weight:600;padding:6px 9px;border-radius:8px;opacity:0;z-index:60;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:#191f28;color:#fff;padding:14px 20px;border-radius:14px;font-weight:600;opacity:0;transition:.25s;z-index:70;max-width:90vw;text-align:center} .toast.on{opacity:1;transform:translateX(-50%)}
  .login{padding-top:14vh} .login .headline{margin-bottom:28px}
  .warn{color:var(--red);font-weight:600;background:var(--red-soft);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:14px;line-height:1.5}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none;margin:0 4px} .dot.ok{background:var(--green)} .dot.warn{background:var(--amber);padding:0;margin:0 4px;border-radius:50%}
  .item.iss{min-height:52px}
  /* 표 (담당자 한눈에, 할 일) */
  .opsw{background:var(--card);border-radius:20px;padding:6px 0;overflow-x:auto;margin-bottom:12px}
  .ops{width:100%;border-collapse:collapse;font-size:14px}
  .ops th{font-size:12px;color:var(--sub);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line2);white-space:nowrap}
  .ops th:first-child,.ops td:first-child{text-align:left}
  .ops td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
  .ops tr:last-child td{border-bottom:0} .ops td b{font-weight:700} .ops tr.cl{cursor:pointer} .ops tr.cl:hover td{background:var(--press)}
  .ops .g{color:var(--green);font-weight:700} .ops .r{color:var(--red);font-weight:700} .ops .n{color:var(--sub)}
  .ops small{display:block;font-size:11px;color:var(--sub);font-weight:500}
  .ops tr.tot td{border-top:1px solid var(--line2);background:var(--press)}
  .log{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5} .log:last-child{border-bottom:0} .log small{display:block;font-size:12px;color:var(--sub);margin-bottom:2px}
  .mline{display:flex;gap:8px;align-items:center;margin-top:10px} .mline .in{height:46px;font-size:15px} .mline .btn{width:auto;height:46px;padding:0 16px;font-size:15px;border-radius:12px;flex:none}
  .num{font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1} .num small{font-size:15px;font-weight:600;color:var(--sub);margin-left:5px;letter-spacing:0}
  .kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border-radius:22px;padding:20px 20px 18px;min-height:110px;text-align:left;display:block;width:100%}
  .kpi .eyebrow{margin-bottom:10px} .kpi .caption{margin-top:9px}
  .gwrap{display:grid;gap:12px} .gside,.gmain{min-width:0}
  .mhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap} .mhead .tx{flex:1;min-width:0} .mhead .ic{flex:none;background:var(--line);height:38px;border-radius:12px}
  .bulk{font-size:13px;color:var(--sub);margin-top:6px;line-height:1.5}
  /* 사람: 이름 동그라미, 나 고르기, 사람별 칸 */
  .ppl{display:flex;gap:4px;justify-content:flex-end;margin-top:6px} .ppl i{font-style:normal;min-width:30px;height:24px;padding:0 7px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--line);color:var(--ink2)} .ppl i.me{background:var(--ac);color:#fff}
  .whoBtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px} .whoBtns button{height:72px;border-radius:18px;background:var(--line);font-size:22px;font-weight:800} .whoBtns button.on{background:var(--ac);color:#fff}
  .me-btn{background:var(--ac-soft);color:var(--ac)!important}
  .board{display:grid;gap:12px} .board .col{background:var(--card);border-radius:22px;padding:16px 0 6px;min-width:0} .board .col h4{font-size:16px;font-weight:800;padding:0 18px 8px;display:flex;gap:6px;align-items:baseline} .board .col h4 small{font-size:13px;color:var(--sub);font-weight:600} .board .col.me{box-shadow:inset 0 0 0 2px var(--ac)}
  .board .item{padding:11px 18px;gap:6px 10px;flex-wrap:wrap} .board .item .tx{flex:1 1 100%} .board .item .tx b{white-space:normal;font-size:15px;line-height:1.35}
  .board .item .val{display:flex;flex-wrap:wrap;align-items:center;gap:6px;text-align:left} .board .item .val span{margin:0!important} .board .ppl{margin:0} .board .chev{display:none}
  .opn{margin:-4px 20px 10px 76px;padding:10px 14px;border-radius:14px;background:var(--bg);font-size:14px;line-height:1.55} .opn p{margin:3px 0;display:flex;gap:8px} .opn p b{flex:none;min-width:36px;color:var(--ac);font-weight:700}
  .opn p.idea,.log.idea{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:6px 10px;margin:6px 0 2px} .opn a,.log a{color:var(--ac);font-weight:700}
  .notes{display:grid;gap:10px;margin-bottom:12px} .note{display:block;width:100%;text-align:left;background:var(--card);border-radius:18px;padding:16px 18px} .note:active{background:var(--press)}
  .note .nt{display:flex;gap:8px;align-items:center} .note .nt b{font-size:16px;font-weight:700;flex:1;min-width:0} .note .nb{font-size:14px;color:var(--ink2);line-height:1.55;margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden} .note small{display:block;font-size:12px;color:var(--sub);margin-top:8px}
  .prog{margin:-6px 20px 8px 20px;padding:8px 12px;border-radius:12px;background:var(--bg);font-size:13px;line-height:1.5} .prog small{color:var(--sub);margin-left:4px}
  .pgrid{display:grid;gap:0 22px}
  .mehead{display:flex;align-items:center;gap:14px} .av.big{width:52px;height:52px;border-radius:50%;font-size:15px}
  .mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px} .mstat{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center} .mstat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.6px} .mstat span{font-size:13px;color:var(--sub);font-weight:600}
  .item.addrow{min-height:46px;justify-content:center}
  .compose{background:var(--card);border-radius:20px;padding:14px} .compose textarea{min-height:64px;font-size:16px} .crow{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px} .seg.sm button{height:34px;font-size:13px;padding:0 12px;white-space:nowrap;flex:none}
  .ilist{display:grid;gap:10px} .icard{background:var(--card);border-radius:20px;overflow:hidden} .ibody{display:block;width:100%;text-align:left;padding:16px 18px 8px} .ibody b{display:block;font-size:17px;font-weight:700;margin-top:6px;line-height:1.4} .ibody p{font-size:14px;color:var(--ink2);margin-top:4px;line-height:1.5;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .imeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--sub)} .reply{margin-top:10px;background:var(--bg);border-radius:12px;padding:8px 12px;font-size:14px} .reply b{display:inline;font-size:14px;color:var(--ac);margin:0 6px 0 0}
  .iact{display:flex;gap:6px;align-items:center;padding:4px 12px 12px} .iact button{height:36px;padding:0 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--ink2)} .iact button:active{background:var(--press)} .iact button.on{background:var(--ac-soft);color:var(--ac)}
  .ist{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink2);white-space:nowrap} .ist.ok{background:var(--green-soft);color:var(--green)} .ist.rev{background:var(--amber-soft);color:var(--amber)} .ist.hold{box-shadow:inset 0 0 0 1px var(--line2);background:none;color:var(--sub)}
  .ibodytext{font-size:15px;line-height:1.6;white-space:pre-wrap;margin-top:8px;color:var(--ink2)}
  .ndot{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:700;margin-left:6px} .nav .ndot{position:absolute;top:2px;left:55%;margin:0}
  .nav button{position:relative}
  .askbox{margin-top:22px;padding:14px;border-radius:16px;background:var(--amber-soft)} .askbox .lbl{color:var(--amber)} .askbox .in{background:var(--card)}

  .ppl i .pe{margin-right:3px} .ppl i{white-space:nowrap;display:inline-flex;align-items:center} .pstat{font-size:14px;color:var(--ac);font-weight:600;margin-top:2px}

<body>
<div class="wrap" id="app"></div>
<nav class="nav" id="nav" style="display:none"><div>
  <button data-tab="me">내 보드</button><button data-tab="todo">할 일</button><button data-tab="idea">제안함</button><button data-tab="meet">회의</button><button data-tab="more">더보기</button>

<div class="toast" id="toast"></div>
<script>
// 온라인팀 회의 보드 — 데이터는 구글시트(회의, 안건, 기록 탭), Apps Script(비밀번호)로 읽고 씀. 비밀번호는 이 기기에만 저장
const APPS_URL = "https://script.google.com/macros/s/AKfycbxjg-ChnaEq4HTy-6K4mhEv8y840A7DPDUIL3BFFKla-N4NT4iVd_suGQ3jaYaG8SG59g/exec";
const BRANDS = ["VF", "액상덕후", "VUFF", "공통"];
const STATUS = ["후보", "확인필요", "시도", "확정", "완료", "보류", "제외"];
const ACTIVE = ["확인필요", "시도", "확정"]; // 할 일로 치는 상태
const FIELDS0 = ["마케팅-바이럴", "제품 디자인", "매장", "CRM", "콘텐츠", "기타"];
// 팀 4명. 시트에 "안보혜,정한섭", "김시원 정한섭"처럼 적힌 옛 값도 화면에서는 이 이름으로 묶어 읽음 (시트 값은 그대로)
const PEOPLE = ["한섭", "보혜", "시원", "진"];
const FULL = { 정한섭: "한섭", 안보혜: "보혜", 김시원: "시원", 김진: "진" };
const peopleOf = (s) => [...new Set(String(s || "").split(/[,\s/、·]+/).map((t) => t.replace(/님$/, "")).filter(Boolean).map((t) => FULL[t] || t))];
const hasP = (s, n) => peopleOf(s).includes(n);
// 프로필: 노트 탭에 종류 "프로필", 작성자 = 이름, 제목 = 한 줄 상태, 내용 = {"e": 대표 이모지, "b": 배지 이모지, "c": 색}
const PCOLORS = { 민트: "#d4f3f1", 핑크: "#ffe1ee", 노랑: "#fff0bf", 하늘: "#dcebff", 보라: "#ebe2ff", 회색: "#eceff1" };
const PEMOJI = ["🐰", "🦊", "🐻", "🐥", "🐱", "🐶", "🐼", "🐸", "🦁", "🐧", "🦄", "🐹", "🌸", "🔥", "⚡", "🍀", "🌙", "⭐", "⚾", "🍩", "🍓", "☕", "🚜", "🎧", "🔫", "🗡️", "💊", "🏏", "🚽", "🌰", "🔑", "💄", "💵"];
const PBADGE = ["☕", "💤", "🎯", "💰", "📦", "🧾", "🛵", "🎉", "😵", "🤒"];
const PBOSS = ["👑", "🏆", "🖋️", "💼", "⛳", "📛", "🪑", "🦸"]; // 이사님 전용
const profNote = (n) => (D && D.notes ? D.notes.find((x) => x.종류 === "프로필" && x.작성자 === n) : null);
const profOf = (n) => { const x = profNote(n); let j = {}; try { j = x ? JSON.parse(x.내용 || "{}") : {}; } catch (e) {} return { e: j.e || "", b: j.b || "", c: PCOLORS[j.c] ? j.c : "민트", s: x ? x.제목 || "" : "", f: Array.isArray(j.f) ? j.f : [] }; };
const avHtml = (n, cls = "") => { const p = profOf(n); return `<span class="pav ${cls}" style="background:${PCOLORS[p.c]}">${p.e ? `<span class="pe1">${esc(p.e)}</span>` : `<span class="pn">${esc(/xl/.test(cls) ? n : [...n][0])}</span>`}${p.b ? `<span class="pb">${esc(p.b)}</span>` : ""}</span>`; };
const sameSet = (a, b) => a.length === b.length && a.every((v) => b.includes(v));
const pplHtml = (s) => { const l = peopleOf(s); return l.length ? `<div class="ppl">${l.map((n) => `<i class="${n === who ? "me" : ""}">${profOf(n).e ? `<span class="pe">${esc(profOf(n).e)}</span>` : ""}${esc(n)}</i>`).join("")}</div>` : ""; };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const ls = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
const WD = "일월화수목금토";
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2600); }
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const pad = (n) => String(n).padStart(2, "0");
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const md = (s) => (s ? s.slice(5).replace("-", "/") : "");
const days = (s) => (s ? Math.round((new Date(s + "T00:00:00") - new Date(today() + "T00:00:00")) / 864e5) : null);
const ddayTxt = (s) => { const d = days(s); return d == null ? "" : d === 0 ? "오늘" : d > 0 ? `D-${d}` : `${-d}일 지남`; };
const weekRange = () => { const t = new Date(today() + "T00:00:00"), dow = (t.getDay() + 6) % 7, a = new Date(t); a.setDate(t.getDate() - dow); const b = new Date(a); b.setDate(a.getDate() + 6); return [ymd(a), ymd(b)]; };

let D = null, KEY = ls.get("ot-key") || "", tab = ls.get("ot-tab") || "me", brandF = ls.get("ot-brand") || "", who = ls.get("ot-who") || "", meetSel = ls.get("ot-meet") || "", todoF = ls.get("ot-todof") || "", ideaF = ls.get("ot-idf") || "", ideaTo = "이사님", hoBrand = ls.get("ot-hob") || "", meetView = ls.get("ot-mview") || "item", edit = null, panelKeep = "", DEMO = /[?&]demo=1/.test(location.search) || !!window.PREVIEW_DATA;

// ── 시트 ──
async function load(key) {
  if (DEMO) { const d = demoData(); d.notes = d.notes || []; return d; }
  if (!APPS_URL) throw Object.assign(new Error("setup"), { code: "setup" });
  const r = await (await fetch(`${APPS_URL}?k=${encodeURIComponent(key)}&t=${Date.now()}`, { cache: "no-store" })).json();
  if (!r.ok) throw Object.assign(new Error(r.error), { code: r.error });
  r.notes = r.notes || [];
  return r;
}
async function post(body) {
  if (DEMO) return { ok: true };
  const r = await (await fetch(APPS_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ k: KEY, ...body }) })).json();
  if (!r.ok) throw new Error(r.error || "fail");
  return r;
}
async function save(kind, data) { // 화면 먼저 바꾸고 시트에 씀, 실패하면 다시 불러옴
  const list = { meeting: D.meetings, item: D.items, log: D.logs, note: D.notes }[kind];
  const i = list.findIndex((x) => x.id === data.id);
  const now = new Date(), stamp = `${ymd(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  if (kind === "item") data.고친시각 = stamp; if (kind === "log" && !data.시각) data.시각 = stamp; if (kind === "meeting" && !data.만든시각) data.만든시각 = stamp; if (kind === "note") data.고친시각 = stamp;
  if (i >= 0) list[i] = { ...list[i], ...data }; else list.push(data);
  if (kind === "item" || kind === "note") mySaved(data.id, data.고친시각);
  render();
  try { await post({ type: "save", kind, data }); } catch (e) { toast("저장하지 못했어요. 다시 불러올게요"); reload(true); }
}
async function del(kind, id) {
  if (kind === "meeting") { const ids = D.items.filter((x) => x.회의id === id).map((x) => x.id); D.items = D.items.filter((x) => x.회의id !== id); D.logs = D.logs.filter((l) => !ids.includes(l.안건id)); D.meetings = D.meetings.filter((m) => m.id !== id); if (meetSel === id) meetSel = ""; }
  if (kind === "item") { D.items = D.items.filter((x) => x.id !== id); D.logs = D.logs.filter((l) => l.안건id !== id); }
  if (kind === "log") D.logs = D.logs.filter((l) => l.id !== id);
  if (kind === "note") { D.notes = D.notes.filter((n) => n.id !== id); D.logs = D.logs.filter((l) => l.안건id !== id); }
  render();
  try { await post({ type: "del", kind, id }); } catch (e) { toast("지우지 못했어요. 다시 불러올게요"); reload(true); }
}
async function reload(quiet) {
  try { D = await load(KEY); if (!$("#dim").classList.contains("on")) render(); if (!quiet) toast("새로 불러왔어요"); }
  catch (e) { if (!quiet) toast("불러오지 못했어요"); }
}

// ── 로그인 ──
function renderLogin(msg) {
  $("#nav").style.display = "none";
  $("#app").innerHTML = `<div class="login"><div class="headline">온라인팀 회의<br><span style="color:var(--sub);font-size:18px;font-weight:600">${msg || "비밀번호를 넣어 주세요"}</span></div>
    <input class="in" id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
    <label style="display:flex;gap:8px;align-items:center;margin:16px 4px;font-size:15px;color:var(--ink2)"><input type="checkbox" id="remember" checked style="width:18px;height:18px;accent-color:var(--ac)"> 이 기기에서 기억하기</label>
    <button class="btn" id="go">열기</button></div>`;
  $("#pw").focus();
}
async function tryLogin() {
  const pw = $("#pw").value.trim(); if (!pw && !DEMO) return;
  $("#go").disabled = true; $("#go").textContent = "여는 중…";
  try { D = await load(pw); KEY = pw; if ($("#remember").checked) ls.set("ot-key", pw); render(); needWho(); }
  catch (e) { renderLogin({ key: "비밀번호가 맞지 않아요", setup: "시트 연결 준비 중이에요 (Apps Script 배포 후 열려요)" }[e.code] || "불러오지 못했어요. 인터넷을 확인해 주세요"); }
}

// ── 공통 조각 ──
const ICON = {
  idea: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2zM9 20h6v1a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1z"/></svg>',
  ho: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zm8 1.5V8h4.5zM8 12v2h8v-2zm0 4v2h6v-2z"/></svg>',

  me: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7.5 0a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2 20c0-3.3 3.1-6 7-6s7 2.7 7 6v1H2zm15.5-6c3 .2 4.5 2.4 4.5 5v2h-4v-1c0-2.4-.9-4.4-2.4-5.7.6-.2 1.2-.3 1.9-.3z"/></svg>',

  meet: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zm3 4v2h10V8zm0 4v2h7v-2z"/></svg>',
  fix: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5zm-1.2 13.6-3.6-3.6 1.4-1.4 2.2 2.2 4.8-4.8 1.4 1.4z"/></svg>',
  todo: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 3h8v2h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3zm2 0v3h4V3zm5.3 7.3-4.3 4.3-2.3-2.3-1.4 1.4 3.7 3.7 5.7-5.7z"/></svg>',
};
const TABS = [["me", "내 보드"], ["home", "홈"], ["todo", "할 일"], ["idea", "제안함"], ["ho", "인수인계"], ["meet", "회의"], ["fix", "확정"]];
const FAV0 = ["me", "todo", "idea", "meet"];
const favs = () => { const f = (who && profOf(who).f) || []; const ok = f.filter((k) => TABS.some(([t]) => t === k)).slice(0, 4); return ok.length ? ok : FAV0; };

const meetOf = (id) => D.meetings.find((m) => m.id === id);
const byBrand = (list) => (brandF ? list.filter((x) => x.브랜드 === brandF || (!x.브랜드 && brandF === "공통")) : list);
const st = (s) => `<span class="st ${esc(s)}">${esc(s)}</span>`;

const owners = () => [...new Set([...PEOPLE, ...D.items.flatMap((x) => peopleOf(x.담당자))])];

const fields = () => [...new Set([...FIELDS0, ...D.items.map((x) => x.분야).filter(Boolean)])];

function itemRow(x, sub) {

function issues() {
  const out = [], [wa, wb] = weekRange();
  for (const x of D.items) {

    if (x.마감 && days(x.마감) < 0) out.push({ k: "bad", t: `${x.제목}, 마감이 ${-days(x.마감)}일 지났어요`, s: x.담당자 || "담당자 없음", id: x.id });
    else if (x.마감 && days(x.마감) <= 3) out.push({ k: "warn", t: `${x.제목}, ${ddayTxt(x.마감)}`, s: x.담당자 || "담당자 없음", id: x.id });
    if (x.상태 === "확정" && noOwner(x)) out.push({ k: "warn", t: `${x.제목}, 확정인데 담당자가 없어요`, s: meetOf(x.회의id)?.제목 || "", id: x.id });
    if (x.상태 === "확인필요" && x.고친시각 && days(x.고친시각.slice(0, 10)) <= -7) out.push({ k: "warn", t: `${x.제목}, 확인필요로 ${-days(x.고친시각.slice(0, 10))}일째예요`, s: x.담당자 || "담당자 없음", id: x.id });
  }

}

// ── 한 줄 할 일 ── 이름(한섭, 보혜, 시원, 진, 이사님, 성 포함), 날짜(오늘, 내일, 모레, 월~일요일, 다음주 X요일, 11/3, 3일)를 알아서 읽음
const WDK = "일월화수목금토";
function parseQuick(t) {
  let text = " " + t.trim() + " ", owners = [], due = "";
  const names = { ...FULL, 이사님: "한섭", 한섭: "한섭", 보혜: "보혜", 시원: "시원", 진: "진" };
  for (const [k, v] of Object.entries(names).sort((a, b) => b[0].length - a[0].length)) {
    const re = new RegExp("(^|[\\s,])" + k + "(님|이|가|는|씨)?(?=[\\s,])", "g");
    if (re.test(text)) { owners.push(v); text = text.replace(re, " "); }
  }
  const base = new Date(today() + "T00:00:00"), plus = (n) => { const d = new Date(base); d.setDate(d.getDate() + n); return ymd(d); };
  const take = (re, fn) => { if (due) return; const m = text.match(re); if (m) { due = fn(m); text = text.replace(m[0], " "); } };
  take(/\s오늘(까지)?\s/, () => plus(0)); take(/\s내일(까지)?\s/, () => plus(1)); take(/\s모레(까지)?\s/, () => plus(2));
  take(/\s다음\s?주\s?([월화수목금토일])(요일)?(까지)?\s/, (m) => { const w = WDK.indexOf(m[1]), d0 = (base.getDay() + 6) % 7; return plus(7 - d0 + ((w + 6) % 7)); });
  take(/\s(이번\s?주\s?)?([월화수목금토일])(요일)(까지)?\s/, (m) => { const w = WDK.indexOf(m[2]); let n = (w - base.getDay() + 7) % 7; if (n === 0) n = 7; return plus(n); });
  take(/\s(\d{1,2})[\/.](\d{1,2})(까지)?\s/, (m) => { let y = base.getFullYear(); const d = `${y}-${pad(+m[1])}-${pad(+m[2])}`; return d < today() ? `${y + 1}-${pad(+m[1])}-${pad(+m[2])}` : d; });
  take(/\s(\d{1,2})일(까지)?\s/, (m) => { const d = new Date(base); d.setDate(+m[1]); if (ymd(d) < today()) d.setMonth(d.getMonth() + 1); return ymd(d); });
  const title = text.replace(/\s+/g, " ").replace(/^(까지|에|은|는)\s/, "").trim();
  return { title, owners: [...new Set(owners)], due };
}

// ── 녹음 ── 2분마다 조각을 시트 쪽(Apps Script)으로 보내 드라이브에 저장. 중간에 끊겨도 보낸 조각은 남음
let REC = null;
const recSupported = () => !!(navigator.mediaDevices && window.MediaRecorder);

function recSend(blob) {
  const R = REC, part = ++R.part;
  R.q = R.q.then(async () => {
    const data = await b64(blob);
    for (let i = 0; i < 3; i++) { try { await post({ type: "rec", meet: R.meet, sess: R.sess, part, mime: R.mime, b64: data }); R.sent++; recTick(); return; } catch (e) { await new Promise((w) => setTimeout(w, 3000 * (i + 1))); } }
    R.fail++; recTick(); toast(`녹음 ${part}번째 조각을 못 보냈어요. 인터넷을 확인해 주세요`);
  });
}
async function recStart() {
  if (!recSupported()) return toast("이 브라우저는 녹음이 안 돼요. 크롬이나 사파리로 열어 주세요");
  let stream; try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); } catch (e) { return toast("마이크를 쓸 수 없어요. 브라우저 마이크 권한을 허용해 주세요"); }
  const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find((m) => MediaRecorder.isTypeSupported(m)) || "";
  const now = new Date(), mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : {});
  REC = { mr, stream, meet: meetSel, sess: `${ymd(now).replace(/-/g, "")}-${pad(now.getHours())}${pad(now.getMinutes())}`, mime: mr.mimeType || mime, part: 0, sent: 0, fail: 0, t0: Date.now(), q: Promise.resolve(), wake: null };
  mr.ondataavailable = (e) => { if (e.data && e.data.size) recSend(e.data); };
  mr.onstop = async () => { const R = REC; R.stream.getTracks().forEach((t) => t.stop()); clearInterval(R.timer); try { R.wake && R.wake.release(); } catch {} R.stopping = true; render(); await R.q; REC = null; render(); toast(R.fail ? `녹음 끝. ${R.fail}조각을 못 보냈어요` : `녹음 저장했어요 (${R.sent}조각)`); };
  mr.start(120000);
